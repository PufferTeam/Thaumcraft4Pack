# Configuration file

compat {
    # Faster but potentially less compatible tracking for GL State.
    # [default: true]
    B:fasterGlStateTracking=true

    # Set this to false if running on modern java
    # [default: true]
    B:weakerProjectRedMixins=true
}


debug {
    # Forces logs at levels [DEBUG] and [TRACE] to appear in the console.
    # Usually, these will only appear in your 'fml-client-*.log' file.
    # [default: false]
    B:forceLogToConsole=false

    # Toggles the logging of the Cookie Monster class, which handles the 'packing' of brightness values for rendering.
    # [default: false]
    B:cookieMonster=false

    # Toggles rendering a light level debug overlay in the world.
    # [default: false]
    B:rgbLightOverlay=false

    # Toggles the logging of classes being blocked or permitted to handle cookie brightness.
    # This relates to the colorization of entities and particles.
    # [default: false]
    B:classBlockList=false

    # Determines how the debug logging configs a treated.
    # [CUSTOM] User defined configs are respected
    # [ALL] Forcibly enables all debug logging. (Most Verbose)
    # [NONE] Fully disables debug logging. (Best Performance)
    # [default: CUSTOM, possible values: [CUSTOM, ALL, NONE]]
    S:logMode=NONE

    # Toggles ASM transformation logging.
    # [default: false]
    B:asmTransformer=false
}


general {
    # Set this to true if you want to enable the default lamps.
    # (Based on ProjectRed's lamps, but much more optimized)
    # [default: true]
    B:craftableLamps=true
}


hardcore_darkness {
    # Disabled: No hardcore darkness
    # BlockOnly: No minimum block light, normal skylight
    # DynamicMoonlight: No minimum block light, skylight is dependent on moon phase
    # Both: No minimum sky & block light
    # [default: Disabled, possible values: [Disabled, BlockOnly, DynamicMoonlight, Both]]
    S:mode=Both

    # Whether the Nether is also supposed to have its minimum light removed
    # [default: true]
    B:darkNether=true

    # In mode 2 this list defines how much skylight there is when 0%/25%/50%/75%/100% of the moon is visible. (Values go from 0 (Total Darkness) to 1 (Total Brightness)).
    # [fixed length: 5]
    # [range: 0.0 ~ 1.0, default: [0.0, 0.075, 0.15, 0.225, 0.3]]
    D:moonLightList <
        0.0
        0.075
        0.15
        0.225
        0.3
     >

    # Whether the End is also supposed to have its minimum light removed
    # [default: false]
    B:darkEnd=false

    # Setting this to something other than -1 will lock the gamma config settings to that value. (0.0 - 1.0)
    # [range: -1.0 ~ 1.0, default: 0.0]
    D:gammaOverride=0.0

    # A list of dimension ids in which Hardcore Darkness will be completely disabled.
    # [max length: 2147483647]
    # [range: -2147483648 ~ 2147483647, default: []]
    I:dimensionBlacklist <
     >
}


